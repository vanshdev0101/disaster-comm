[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
lib_deps = sandeepmistry/LoRa@^0.8.0

[env:node]
build_src_filter = +<node.cpp>
lib_deps =
    ${env.lib_deps}
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0

[env:gateway]
build_src_filter = +<gateway.cpp>

[env:diag]
build_src_filter = +<diag.cpp>

[env:node_lora_only]
extends = env:node
build_flags = -DNODE_LORA_ONLY
