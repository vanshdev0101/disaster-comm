<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" font-family="sans-serif">
<rect width="1000" height="640" fill="#fff"/>
<text x="500" y="38" font-size="24" text-anchor="middle" font-weight="bold">HC-SR04 water-level sensor wiring</text>
<!-- sensor -->
<rect x="30" y="110" width="170" height="330" rx="10" fill="#1d4ed8"/>
<text x="115" y="150" font-size="18" fill="#fff" text-anchor="middle">HC-SR04</text>
<text x="115" y="172" font-size="13" fill="#fff" text-anchor="middle">(the two "eyes")</text>
<g font-size="16" font-weight="bold">
<rect x="200" y="203" width="50" height="14" fill="#dc2626"/><text x="185" y="216" fill="#fff" text-anchor="end">VCC</text>
<rect x="200" y="263" width="50" height="14" fill="#2563eb" stroke="#fff"/><text x="185" y="276" fill="#fff" text-anchor="end">Trig</text>
<rect x="200" y="323" width="50" height="14" fill="#f59e0b"/><text x="185" y="336" fill="#fff" text-anchor="end">Echo</text>
<rect x="200" y="383" width="50" height="14" fill="#111"/><text x="185" y="396" fill="#fff" text-anchor="end">GND</text>
</g>
<!-- wires -->
<path d="M250 210 H660" stroke="#dc2626" stroke-width="7"/>
<path d="M250 270 H660" stroke="#2563eb" stroke-width="7"/>
<path d="M250 330 H330" stroke="#f59e0b" stroke-width="7"/>
<path d="M250 390 H660" stroke="#111" stroke-width="7"/>
<!-- divider -->
<rect x="330" y="315" width="70" height="30" fill="#e5c07b" stroke="#333"/><text x="365" y="336" font-size="14" text-anchor="middle">2.2k</text>
<path d="M400 330 H500" stroke="#f59e0b" stroke-width="7"/>
<circle cx="500" cy="330" r="7" fill="#f59e0b"/>
<text x="500" y="312" font-size="13" text-anchor="middle">row X (junction)</text>
<path d="M500 330 H660" stroke="#f59e0b" stroke-width="7" stroke-dasharray="1 0"/>
<path d="M500 337 V365" stroke="#333" stroke-width="3"/>
<rect x="485" y="365" width="30" height="55" fill="#e5c07b" stroke="#333"/><text x="530" y="397" font-size="14">4.7k</text>
<path d="M500 420 V390" stroke="#333" stroke-width="3"/>
<circle cx="500" cy="390" r="6" fill="#111"/>
<text x="330" y="302" font-size="13" text-anchor="middle">row Y: Echo + 2.2k</text>
<!-- esp pins -->
<g font-size="15" font-weight="bold">
<rect x="660" y="190" width="310" height="40" rx="6" fill="#fecaca" stroke="#991b1b"/><text x="815" y="216" text-anchor="middle">VIN  (right row, 1st pin) = 5V</text>
<rect x="660" y="250" width="310" height="40" rx="6" fill="#bfdbfe" stroke="#1e40af"/><text x="815" y="276" text-anchor="middle">D25  (right row, 8th pin)</text>
<rect x="660" y="310" width="310" height="40" rx="6" fill="#fde68a" stroke="#92400e"/><text x="815" y="336" text-anchor="middle">D33  (right row, 9th pin)</text>
<rect x="660" y="370" width="310" height="40" rx="6" fill="#e5e7eb" stroke="#111"/><text x="815" y="396" text-anchor="middle">GROUND ROW</text>
</g>
<text x="500" y="500" font-size="17" text-anchor="middle">Echo never goes straight to D33: 5V would hurt the ESP32.</text>
<text x="500" y="530" font-size="17" text-anchor="middle">Divider: Echo - 2.2k - (row X to D33) - 4.7k - GND row  =  about 3.4V.</text>
<text x="500" y="560" font-size="17" text-anchor="middle">Right row from USB end: VIN, GND, D13, D12, D14, D27, D26, D25, D33</text>
</svg>
