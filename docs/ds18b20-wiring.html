<text x="608" y="112" font-size="13" font-weight="700">Order</text>
<text x="608" y="138" font-size="13" font-weight="400">1. Rails: J1 and J2, then move the radio's red and black plugs onto the rails.</text>
<text x="608" y="164" font-size="13" font-weight="400">   Check the radio still prints LoRa ready.</text>
<text x="608" y="190" font-size="13" font-weight="400">2. Junction row: J3 from the D4 row, probe YELLOW,</text>
<text x="608" y="216" font-size="13" font-weight="400">   and one leg of the 4.7k resistor, all in ONE row.</text>
<text x="608" y="242" font-size="13" font-weight="400">3. 4.7k other leg -> + rail.</text>
<text x="608" y="268" font-size="13" font-weight="400">4. Probe RED -> + rail.  Probe BLACK -> - rail.</text>
<text x="608" y="294" font-size="13" font-weight="400"></text>
<text x="608" y="320" font-size="13" font-weight="400">Check: temp_c on the dashboard should be about</text>
<text x="608" y="346" font-size="13" font-weight="400">room temperature (25-33), not -127.</text>
<text x="590" y="450" font-size="12" fill="#a16207" font-weight="700">Never connect the 4.7k or the probe to VIN or 5 V.</text>
