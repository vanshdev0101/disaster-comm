<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" font-family="sans-serif"><rect width="1000" height="640" fill="#fff"/>
<text x="500" y="36" font-size="24" text-anchor="middle" font-weight="bold">Echo divider: exactly where each part goes</text>
<text x="500" y="62" font-size="14" text-anchor="middle" fill="#555">Each coloured strip = ONE breadboard row of 5 connected holes (same side of the centre channel). Parts in the same strip are connected.</text>
<rect x="300" y="120" width="260" height="60" rx="8" fill="#f3f4f6" stroke="#f59e0b" stroke-width="3"/>
<circle cx="330" cy="150" r="9" fill="#fff" stroke="#888"/>
<circle cx="380" cy="150" r="9" fill="#fff" stroke="#888"/>
<circle cx="430" cy="150" r="9" fill="#fff" stroke="#888"/>
<circle cx="480" cy="150" r="9" fill="#fff" stroke="#888"/>
<circle cx="530" cy="150" r="9" fill="#fff" stroke="#888"/>
<text x="305" y="112" font-size="16" font-weight="bold" text-anchor="start" fill="#f59e0b">ROW Y</text>
<rect x="300" y="260" width="260" height="60" rx="8" fill="#f3f4f6" stroke="#16a34a" stroke-width="3"/>
<circle cx="330" cy="290" r="9" fill="#fff" stroke="#888"/>
<circle cx="380" cy="290" r="9" fill="#fff" stroke="#888"/>
<circle cx="430" cy="290" r="9" fill="#fff" stroke="#888"/>
<circle cx="480" cy="290" r="9" fill="#fff" stroke="#888"/>
<circle cx="530" cy="290" r="9" fill="#fff" stroke="#888"/>
<text x="305" y="252" font-size="16" font-weight="bold" text-anchor="start" fill="#16a34a">ROW X</text>
<rect x="300" y="400" width="260" height="60" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
<circle cx="330" cy="430" r="9" fill="#fff" stroke="#888"/>
<circle cx="380" cy="430" r="9" fill="#fff" stroke="#888"/>
<circle cx="430" cy="430" r="9" fill="#fff" stroke="#888"/>
<circle cx="480" cy="430" r="9" fill="#fff" stroke="#888"/>
<circle cx="530" cy="430" r="9" fill="#fff" stroke="#888"/>
<text x="305" y="392" font-size="16" font-weight="bold" text-anchor="start" fill="#374151">GROUND ROW</text>
<line x1="330" y1="150" x2="100" y2="150" stroke="#f59e0b" stroke-width="6" />
<text x="100" y="135" font-size="15" font-weight="bold">from sensor ECHO</text>
<line x1="430" y1="150" x2="430" y2="290" stroke="#333" stroke-width="3" />
<rect x="410" y="190" width="40" height="60" fill="#e5c07b" stroke="#333"/><text x="465" y="225" font-size="17" font-weight="bold">2.2k</text>
<line x1="530" y1="290" x2="760" y2="290" stroke="#f59e0b" stroke-width="6" />
<text x="770" y="296" font-size="15" font-weight="bold">jumper to ESP32 D33</text>
<line x1="480" y1="290" x2="480" y2="430" stroke="#333" stroke-width="3" />
<rect x="460" y="330" width="40" height="60" fill="#e5c07b" stroke="#333"/><text x="515" y="365" font-size="17" font-weight="bold">4.7k</text>
<line x1="330" y1="430" x2="100" y2="430" stroke="#111" stroke-width="6" />
<text x="100" y="415" font-size="15" font-weight="bold">from sensor GND</text>
<line x1="560" y1="430" x2="760" y2="430" stroke="#111" stroke-width="6" stroke-dasharray="8 6"/>
<text x="770" y="436" font-size="15">(already linked to ESP32 GND)</text>
<text x="500" y="535" font-size="18" text-anchor="middle" font-weight="bold">Circuit: ECHO - 2.2k - (row X = D33) - 4.7k - GND</text>
<text x="500" y="615" font-size="14" text-anchor="middle" fill="#555">VCC -> VIN hole, Trig -> D25 hole: direct jumpers, no resistor. Resistors only on Echo.</text></svg>