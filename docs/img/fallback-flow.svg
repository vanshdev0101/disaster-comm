<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" font-family="sans-serif">
<rect width="1100" height="470" fill="#fff"/>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11" refX="12" refY="5.5" orient="auto"><path d="M0,0 L13,5.5 L0,11 z" fill="#334155"/></marker></defs>
<g font-size="13" fill="#0f172a" text-anchor="middle">
<text x="190" y="28" font-weight="bold" font-size="15">ON THE NODE (every 3 s)</text>
<rect x="60" y="45" width="260" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="190" y="73">1. Read all sensors, build JSON</text>
<path d="M190 91 V115" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="60" y="115" width="260" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="190" y="143">2. Try to POST over Wi-Fi</text>
<path fill="none" d="M120 161 V200 H110 V215" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/><text x="70" y="192" fill="#15803d" font-weight="bold">success</text>
<path fill="none" d="M260 161 V200 H290 V215" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a)"/><text x="296" y="192" fill="#b91c1c" font-weight="bold">fails</text>
<rect x="10" y="215" width="200" height="84" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/><text x="110" y="243">3a. Send the queued backlog</text><text x="110" y="263">(old readings, with their</text><text x="110" y="283">age so times stay correct)</text>
<rect x="225" y="215" width="190" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="320" y="243">3b. Send over LoRa AND</text><text x="320" y="263">save the reading in the</text><text x="320" y="283">flash backlog queue</text>
<text x="190" y="340" fill="#475569">Same reading = same (node, boot, seq) ID on both paths</text>
<path d="M415 257 H470" stroke="#d97706" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#a)"/>
<text x="700" y="28" font-weight="bold" font-size="15">GATEWAY, THEN SERVER</text>
<rect x="470" y="225" width="170" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="555" y="252">Gateway receives</text><text x="555" y="272">LoRa, adds signal (RSSI)</text>
<path d="M640 257 H700" stroke="#d97706" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#a)"/>
<rect x="700" y="45" width="370" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="885" y="73">Server receives reading (from node or gateway)</text>
<path d="M885 91 V115" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="700" y="115" width="370" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="885" y="143">Already stored? (same node + boot + seq) &#8594; ignore</text>
<path d="M885 161 V185" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="700" y="185" width="370" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="885" y="213">Store with its real measurement time</text>
<path d="M885 231 V255" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="700" y="255" width="370" height="46" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="885" y="283">Compare with alert thresholds</text>
<path d="M885 301 V325" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="700" y="325" width="370" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="885" y="353">Open an incident (one per node + hazard)</text>
<path d="M885 371 V395" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="700" y="395" width="370" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="885" y="423">Dashboard shows it, beeps, suggests resources</text>
</g></svg>
